{% extends "base.html" %}
{% from "components/logo.html" import logo %}
{% block title %}회원가입{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div style="margin-bottom:14px">{{ logo(40, 'reg') }}</div>
    <h1>회원가입</h1>
    <p class="muted">내 경험·지원 기록은 내 계정에만 저장됩니다.</p>
    {% include "components/flash.html" %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="name">이름</label><input id="name" type="text" name="name" required></div>
      <div class="field"><label for="email">이메일</label><input id="email" type="email" name="email" required></div>
      <div class="field"><label for="password">비밀번호 (8자 이상)</label><input id="password" type="password" name="password" minlength="8" required></div>
      <button class="btn" type="submit" style="width:100%;justify-content:center">가입하기</button>
    </form>
    <p class="muted" style="margin-top:14px">이미 계정이 있나요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
  </div>
</div>
{% endblock %}
