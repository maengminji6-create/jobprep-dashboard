{# CAIRN 로고: 조약돌 셋을 쌓은 돌탑(케언) — 잉크색 두 개 + 맨 위 슬레이트 블루 하나, 가는 산세리프 워드마크.
   경험을 하나씩 쌓아 길을 표시한다는 뜻. uid 는 예전 호출과 맞추려고 남겨 둔 인자 #}
{% macro logo_mark(size=32, uid='a') %}
<svg class="logo-mark" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true">
  <ellipse cx="16" cy="24.6" rx="10.2" ry="4.1" fill="currentColor"/>
  <ellipse cx="15.4" cy="17.4" rx="7.4" ry="3.5" fill="currentColor" transform="rotate(-6 15.4 17.4)"/>
  <ellipse cx="16.8" cy="10.6" rx="4.6" ry="3.3" fill="#6f8cab" transform="rotate(-12 16.8 10.6)"/>
</svg>
{% endmacro %}

{% macro logo(size=32, uid='a') %}
<span class="logo">{{ logo_mark(size, uid) }}<span class="logo-word">CAIRN</span></span>
{% endmacro %}
