{% extends "base.html" %}
{% from "components/macros.html" import csrf %}
{% block title %}자격증 수정{% endblock %}
{% block content %}
<div class="page-head">
  <div><span class="eyebrow">Edit Certificate</span><h1>자격증·어학 수정</h1>
    <p>저장하면 관련 직무 적합도에 바로 반영돼요.</p></div>
  <a class="btn secondary" href="{{ url_for('experiences.index') }}#certs">← 경험 분석</a>
</div>
<form class="card" method="post" style="max-width:760px">
  {{ csrf() }}
  <div class="row">
    <div class="field" style="flex:2 1 240px"><label>자격증·시험 이름</label><input type="text" name="cert_name" value="{{ cert.name }}" required></div>
    <div class="field"><label>점수·등급</label><input type="text" name="cert_score" value="{{ cert.score or '' }}"></div>
    <div class="field"><label>취득일</label><input type="text" name="cert_date" value="{{ cert.acquired or '' }}"></div>
  </div>
  <div class="field"><label>발급 기관</label><input type="text" name="cert_issuer" value="{{ cert.issuer or '' }}"></div>
  <div class="field"><label>메모</label><textarea name="cert_note">{{ cert.note or '' }}</textarea></div>
  <button class="btn" type="submit">저장</button>
</form>
{% endblock %}
